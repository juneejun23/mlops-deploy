image:
  repository: rayproject/ray
  tag: 2.56.0
  pullPolicy: IfNotPresent

head:
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  rayStartParams:
    dashboard-host: "0.0.0.0"

worker:
  groupName: cpu-worker
  replicas: 1
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  rayStartParams: {}

additionalWorkerGroups:
  gpu-worker:
    replicas: 1
    resources:
      requests:
        cpu: "500m"
        memory: "4Gi"
        nvidia.com/gpu: 1
      limits:
        cpu: "2"
        memory: "8Gi"
        nvidia.com/gpu: 1
    rayStartParams:
      num-gpus: "1"
    runtimeClassName: nvidia