apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: xception-train
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:juneejun23/mlops-deploy.git
    targetRevision: main
    path: k8s/xception-train
  destination:
    server: https://kubernetes.default.svc
    namespace: mlops-backend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
  - group: apps
    kind: Deployment
    name: xception-preprocess
    jsonPointers:
    - /spec/replicas